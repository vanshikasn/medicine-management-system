spring.application.name=medicine-service

# PostgreSQL connection. Built from separate pieces so it works locally and on
# hosts (like Render) that expose host/port/name individually. Defaults target
# localhost, so local dev needs no extra config.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medicine_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:test}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server (moved to 8082; gateway takes 8080)
server.port=${SERVER_PORT:8082}

# JWT settings - secret MUST match user-service so tokens can be verified here.
app.jwt.secret=${JWT_SECRET:dev-super-secret-key-change-me-please-1234567890}
