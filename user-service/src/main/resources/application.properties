spring.application.name=user-service

# PostgreSQL connection (shared medicine_db, holds medicine + app_users tables).
# We build the JDBC URL from separate pieces so it works both locally and on
# hosts (like Render) that expose host/port/name individually. Each piece has a
# localhost default, so nothing extra is needed for local dev.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medicine_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:test}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server (different port from medicine-service)
server.port=${SERVER_PORT:8081}

# JWT settings
# Secret used to SIGN tokens. Must be the SAME in medicine-service so it can verify.
# For dev only; in production this comes from an environment variable.
app.jwt.secret=${JWT_SECRET:dev-super-secret-key-change-me-please-1234567890}
# Token validity in milliseconds (here: 4 hours)
app.jwt.expiration-ms=14400000

# Dev-only fixed OTP (no SMS). Any mobile "receives" this OTP.
app.otp.dev-code=123456
